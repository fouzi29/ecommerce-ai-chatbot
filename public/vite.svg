<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Vibrant Gradient Backdrop -->
    <linearGradient id="auraGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Sparkle Glow -->
    <radialGradient id="sparkleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Inner Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#auraGradient)" filter="url(#shadow)" />
  
  <!-- Outer Glow Ring -->
  <rect x="36" y="36" width="440" height="440" rx="108" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.25" />

  <!-- Robot Head & Antenna -->
  <g transform="translate(0, 10)">
    <!-- Antenna Line & Bulb -->
    <line x1="256" y1="110" x2="256" y2="150" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />
    <circle cx="256" cy="96" r="22" fill="#38bdf8" stroke="#ffffff" stroke-width="8" />

    <!-- Main Robot Face Container -->
    <rect x="116" y="150" width="280" height="210" rx="48" fill="#0f172a" stroke="#ffffff" stroke-width="12" />

    <!-- Glowing Visor -->
    <rect x="146" y="180" width="220" height="96" rx="28" fill="#1e1b4b" />

    <!-- Robot Eyes (Glowing Cyan Stars/Circles) -->
    <circle cx="200" cy="228" r="22" fill="#38bdf8" />
    <circle cx="312" cy="228" r="22" fill="#38bdf8" />
    
    <!-- Eye Catchlights -->
    <circle cx="208" cy="220" r="7" fill="#ffffff" />
    <circle cx="320" cy="220" r="7" fill="#ffffff" />

    <!-- Smiling AI Wave Mouth -->
    <path d="M 200 300 Q 256 330 312 300" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" />

    <!-- Ears / Head Bolts -->
    <rect x="88" y="215" width="28" height="80" rx="12" fill="#7c3aed" stroke="#ffffff" stroke-width="8" />
    <rect x="396" y="215" width="28" height="80" rx="12" fill="#0284c7" stroke="#ffffff" stroke-width="8" />
  </g>

  <!-- AI Magic Sparkle 4-Point Star (Top Right) -->
  <path d="M 400 80 Q 400 130 450 130 Q 400 130 400 180 Q 400 130 350 130 Q 400 130 400 80 Z" fill="#f59e0b" stroke="#ffffff" stroke-width="6" />

  <!-- Secondary Sparkle (Bottom Left) -->
  <path d="M 100 380 Q 100 410 130 410 Q 100 410 100 440 Q 100 410 70 410 Q 100 410 100 380 Z" fill="#38bdf8" stroke="#ffffff" stroke-width="4" />
</svg>
